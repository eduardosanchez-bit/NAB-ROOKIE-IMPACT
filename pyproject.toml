[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-rookie-impact"
version = "0.1.0"
description = "Impact and draft-slot value of NBA rookies, with a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "nba_api>=1.5"]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.20"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
